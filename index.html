<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Tebak Hewan — Permainan Seru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: muncul 0.8s ease-out;
        }

        @keyframes muncul {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .skor {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(90deg, #ffecd2, #fcb69f);
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #5a3e36;
        }

        .hewan-emoji {
            font-size: 5rem;
            margin: 20px 0;
            animation: goyang 1s infinite;
        }

        @keyframes goyang {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .petunjuk {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            font-style: italic;
            color: #444;
        }

        .kotak-jawaban {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 3px solid #ddd;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .kotak-jawaban:focus {
            outline: none;
            border-color: #667eea;
        }

        .tombol {
            padding: 14px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-weight: bold;
        }

        .tombol-kirim {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .tombol-kirim:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .tombol-lewati {
            background: #ff9a9e;
            color: white;
        }

        .tombol-lewati:hover {
            background: #ff6b6b;
        }

        .hasil {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            display: none;
        }

        .benar {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .salah {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .akhir {
            margin-top: 20px;
            display: none;
        }

        .akhir h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .tombol-ulang {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .tombol-ulang:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 TEBAK HEWAN 🐾</h1>
        
        <div class="skor">
            <div>✅ Benar: <span id="jumlahBenar">0</span></div>
            <div>❌ Salah: <span id="jumlahSalah">0</span></div>
            <div>📊 Soal: <span id="nomorSoal">1</span>/10</div>
        </div>

        <div id="areaPermainan">
            <div class="hewan-emoji" id="emojiHewan">🐶</div>
            <div class="petunjuk" id="petunjuk">Hewan ini adalah sahabat manusia dan suka menggonggong</div>
            
            <input type="text" class="kotak-jawaban" id="jawabanPengguna" placeholder="Ketik nama hewan di sini..." autocomplete="off">
            
            <br>
            <button class="tombol tombol-kirim" onclick="cekJawaban()">✅ Kirim Jawaban</button>
            <button class="tombol tombol-lewati" onclick="lewatiSoal()">⏭️ Lewati</button>
            
            <div class="hasil" id="tampilHasil"></div>
        </div>

        <div class="akhir" id="areaAkhir">
            <h2>🎉 Permainan Selesai! 🎉</h2>
            <p style="font-size: 1.2rem; margin-bottom: 15px;">Skor Akhir Kamu:</p>
            <p style="font-size: 2rem; font-weight: bold; color: #667eea;" id="skorAkhir"></p>
            <button class="tombol tombol-ulang" onclick="mulaiUlang()">🔄 Main Lagi</button>
        </div>
    </div>

    <script>
        // Daftar Soal Tebak Hewan
        const daftarHewan = [
            { nama: "anjing", emoji: "🐶", petunjuk: "Sahabat setia manusia, suka menggonggong" },
            { nama: "kucing", emoji: "🐱", petunjuk: "Suka makan ikan, mengeong, dan tidur panjang" },
            { nama: "gajah", emoji: "🐘", petunjuk: "Hewan darat terbesar, punya belalai panjang" },
            { nama: "singa", emoji: "🦁", petunjuk: "Raja hutan, memiliki surai yang gagah" },
            { nama: "kuda", emoji: "🐴", petunjuk: "Bisa berlari cepat, sering ditunggangi" },
            { nama: "burung", emoji: "🐦", petunjuk: "Punya sayap, bisa terbang di langit" },
            { nama: "ikan", emoji: "🐟", petunjuk: "Hidup di air, bernapas dengan insang" },
            { nama: "kelinci", emoji: "🐰", petunjuk: "Telinganya panjang, suka makan wortel" },
            { nama: "ular", emoji: "🐍", petunjuk: "Tidak berkaki, merayap di tanah" },
            { nama: "panda", emoji: "🐼", petunjuk: "Berbulu hitam putih, suka makan bambu" }
        ];

        let indeksSekarang = 0;
        let jumlahBenar = 0;
        let jumlahSalah = 0;
        let sudahDijawab = false;

        // Tampilkan soal pertama
        tampilkanSoal();

        function tampilkanSoal() {
            const soal = daftarHewan[indeksSekarang];
            document.getElementById("emojiHewan").textContent = soal.emoji;
            document.getElementById("petunjuk").textContent = soal.petunjuk;
            document.getElementById("jawabanPengguna").value = "";
            document.getElementById("tampilHasil").style.display = "none";
            document.getElementById("nomorSoal").textContent = indeksSekarang + 1;
            sudahDijawab = false;
        }

        function cekJawaban() {
            if (sudahDijawab) return;
            
            const jawabanPengguna = document.getElementById("jawabanPengguna").value.trim().toLowerCase();
            const jawabanBenar = daftarHewan[indeksSekarang].nama;
            const tampilHasil = document.getElementById("tampilHasil");

            if (!jawabanPengguna) {
                alert("Silakan ketik jawabanmu terlebih dahulu!");
                return;
            }

            sudahDijawab = true;

            if (jawabanPengguna === jawabanBenar) {
                jumlahBenar++;
                tampilHasil.textContent = "✅ BENAR! Hebat sekali!";
                tampilHasil.className = "hasil benar";
            } else {
                jumlahSalah++;
                tampilHasil.textContent = `❌ SALAH! Jawabannya adalah: ${jawabanBenar}`;
                tampilHasil.className = "hasil salah";
            }

            tampilHasil.style.display = "block";
            perbaruiSkor();

            setTimeout(soalBerikutnya, 1500);
        }

        function lewatiSoal() {
            if (sudahDijawab) return;
            sudahDijawab = true;
            jumlahSalah++;
            const tampilHasil = document.getElementById("tampilHasil");
            tampilHasil.textContent = `⏭️ Dilewati. Jawabannya: ${daftarHewan[indeksSekarang].nama}`;
            tampilHasil.className = "hasil salah";
            tampilHasil.style.display = "block";
            perbaruiSkor();
            setTimeout(soalBerikutnya, 1500);
        }

        function soalBerikutnya() {
            indeksSekarang++;
            if (indeksSekarang < daftarHewan.length) {
                tampilkanSoal();
            } else {
                tampilkanHasilAkhir();
            }
        }

        function perbaruiSkor() {
            document.getElementById("jumlahBenar").textContent = jumlahBenar;
            document.getElementById("jumlahSalah").textContent = jumlahSalah;
        }

        function tampilkanHasilAkhir() {
            document.getElementById("areaPermainan").style.display = "none";
            document.getElementById("areaAkhir").style.display = "block";
            
            const persentase = Math.round((jumlahBenar / daftarHewan.length) * 100);
            let pesan = "";
            
            if (persentase === 100) pesan = "🏆 Sempurna! Kamu jenius!";
            else if (persentase >= 80) pesan = "🌟 Luar biasa! Kerja bagus!";
            else if (persentase >= 60) pesan = "👍 Bagus! Tetap semangat!";
            else pesan = "💪 Jangan menyerah, coba lagi ya!";

            document.getElementById("skorAkhir").innerHTML = 
                `${jumlahBenar} dari ${daftarHewan.length} soal<br>
                ${persentase}% Benar<br>
                ${pesan}`;
        }

        function mulaiUlang() {
            indeksSekarang = 0;
            jumlahBenar = 0;
            jumlahSalah = 0;
            document.getElementById("areaPermainan").style.display = "block";
            document.getElementById("areaAkhir").style.display = "none";
            perbaruiSkor();
            tampilkanSoal();
        }

        // Izinkan tekan Enter untuk mengirim jawaban
        document.getElementById("jawabanPengguna").addEventListener("keypress", function(e) {
            if (e.key === "Enter") cekJawaban();
        });
    </script>
</body>
</html>

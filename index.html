<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Quest - Tebak Angka Mudah</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #171a3b, #34206b, #171a3b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.game {
    width: 100%;
    max-width: 430px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    background: linear-gradient(135deg, #7c5cff, #b06cff);
    box-shadow: 0 10px 30px rgba(124,92,255,0.35);
}

h1 {
    margin-top: 15px;
    font-size: 29px;
    letter-spacing: 1px;
}

.header p {
    margin-top: 7px;
    color: #c7c7df;
    font-size: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 18px;
}

.stat {
    background: rgba(255,255,255,0.09);
    border-radius: 15px;
    padding: 12px 5px;
    text-align: center;
}

.stat small {
    display: block;
    color: #aaaac7;
    font-size: 10px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 19px;
}

.message {
    min-height: 70px;
    padding: 15px;
    border-radius: 16px;
    background: rgba(0,0,0,0.18);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 18px;
}

label {
    display: block;
    color: #dcdced;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 55px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 15px;
    outline: none;
    background: rgba(255,255,255,0.08);
    color: white;
    text-align: center;
    font-size: 21px;
    margin-bottom: 11px;
}

input::placeholder {
    color: #85859f;
}

input:focus {
    border-color: #9a82ff;
    box-shadow: 0 0 0 3px rgba(154,130,255,0.12);
}

button {
    border: none;
    color: white;
    font-weight: bold;
    font-size: 14px;
    border-radius: 15px;
    min-height: 50px;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.96);
}

.guess {
    width: 100%;
    background: linear-gradient(135deg, #7c5cff, #a55cff);
    box-shadow: 0 8px 22px rgba(124,92,255,0.28);
}

.guess:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.start {
    background: #20a66a;
}

.reset {
    background: #d94b61;
}

.hint {
    margin-top: 15px;
    text-align: center;
    color: #aaaac7;
    font-size: 12px;
}

.footer {
    text-align: center;
    color: #777791;
    font-size: 10px;
    margin-top: 20px;
}

.pop {
    animation: pop 0.3s ease;
}

@keyframes pop {
    0% { transform: scale(0.96); }
    100% { transform: scale(1); }
}

.win {
    animation: win 0.6s ease;
}

@keyframes win {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}

@media (max-width: 360px) {
    .game {
        padding: 19px;
    }

    h1 {
        font-size: 25px;
    }

    .logo {
        width: 65px;
        height: 65px;
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="header">
        <div class="logo">🎯</div>
        <h1>NUMBER QUEST</h1>
        <p>Tebak angka santai dari 1 sampai 10!</p>
    </div>

    <div class="stats">
        <div class="stat">
            <small>❤️ NYAWA</small>
            <strong id="lives">5</strong>
        </div>

        <div class="stat">
            <small>⭐ SKOR</small>
            <strong id="score">100</strong>
        </div>

        <div class="stat">
            <small>🎮 LEVEL</small>
            <strong id="level">1</strong>
        </div>
    </div>

    <div class="message" id="message">
        Tekan <b>Mulai Game</b> untuk memulai!
    </div>

    <label for="guess">MASUKKAN TEBAKAN</label>

    <input
        type="number"
        id="guess"
        min="1"
        max="10"
        placeholder="1 - 10"
        disabled
    >

    <button
        class="guess"
        id="guessButton"
        onclick="checkGuess()"
        disabled>
        🎯 TEBAK ANGKA
    </button>

    <div class="buttons">
        <button class="start" onclick="startGame()" id="startButton">
            ▶ MULAI GAME
        </button>

        <button class="reset" onclick="resetGame()">
            ↻ RESET
        </button>
    </div>

    <div class="hint">
        💡 Petunjuk: Semakin sedikit percobaan, semakin tinggi skor!
    </div>

    <div class="footer">
        NUMBER QUEST • Game HTML sederhana • Tanpa Database
    </div>

</div>

<script>

let secretNumber = 0;
let lives = 5;
let score = 100;
let level = 1;
let playing = false;

const guessInput = document.getElementById("guess");
const guessButton = document.getElementById("guessButton");
const message = document.getElementById("message");
const livesText = document.getElementById("lives");
const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const startButton = document.getElementById("startButton");
const game = document.getElementById("game");

function startGame() {
    // Diubah menjadi rentang 1 - 10
    secretNumber = Math.floor(Math.random() * 10) + 1;

    lives = 5;
    score = 100;

    playing = true;

    guessInput.disabled = false;
    guessButton.disabled = false;

    livesText.innerText = lives;
    scoreText.innerText = score;

    message.innerHTML =
        "🎮 Game dimulai! Tebak angka dari <b>1 sampai 10</b>.";

    guessInput.value = "";
    guessInput.focus();

    startButton.innerText = "🎮 MAIN LAGI";

    game.classList.remove("win");
}

function checkGuess() {

    if (!playing) return;

    let guess = Number(guessInput.value);

    // Input kosong
    if (guessInput.value === "") {
        message.innerHTML =
            "⚠️ Masukkan angka terlebih dahulu!";
        return;
    }

    // Di luar batas 1-10
    if (guess < 1 || guess > 10) {
        message.innerHTML =
            "⚠️ Masukkan angka antara <b>1 - 10</b>.";
        return;
    }

    // Angka terlalu kecil
    if (guess < secretNumber) {
        lives--;
        score = Math.max(0, score - 10);

        message.innerHTML =
            "📈 <b>Terlalu kecil!</b><br>" +
            "Coba angka yang lebih besar.";
    }

    // Angka terlalu besar
    else if (guess > secretNumber) {
        lives--;
        score = Math.max(0, score - 10);

        message.innerHTML =
            "📉 <b>Terlalu besar!</b><br>" +
            "Coba angka yang lebih kecil.";
    }

    // Angka benar
    else {
        let bonus = lives * 20;
        score += bonus;

        message.innerHTML =
            "🎉 <b>LUAR BIASA!</b><br>" +
            "Angka rahasianya adalah <b>" +
            secretNumber +
            "</b>.<br>" +
            "Bonus kemenangan: +" +
            bonus +
            " ⭐";

        playing = false;

        guessInput.disabled = true;
        guessButton.disabled = true;

        startButton.innerText = "🏆 MAIN LAGI";

        game.classList.add("win");

        updateDisplay();

        return;
    }

    updateDisplay();

    guessInput.value = "";
    guessInput.focus();

    // Jika nyawa habis
    if (lives <= 0) {
        message.innerHTML =
            "💥 <b>GAME OVER!</b><br>" +
            "Angka yang benar adalah <b>" +
            secretNumber +
            "</b>.";

        playing = false;

        guessInput.disabled = true;
        guessButton.disabled = true;

        startButton.innerText = "🔄 COBA LAGI";
    }
}

function updateDisplay() {
    livesText.innerText = lives;
    scoreText.innerText = score;
    levelText.innerText = level;
}

function resetGame() {
    secretNumber = 0;
    lives = 5;
    score = 100;
    level = 1;
    playing = false;

    guessInput.value = "";
    guessInput.disabled = true;
    guessButton.disabled = true;

    livesText.innerText = "5";
    scoreText.innerText = "100";
    levelText.innerText = "1";

    message.innerHTML =
        "Tekan <b>Mulai Game</b> untuk memulai!";

    startButton.innerText = "▶ MULAI GAME";

    game.classList.remove("win");
}

guessInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkGuess();
    }
});

</script>

</body>
</html>
